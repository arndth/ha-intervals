<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ha-intervals-panel — Prüfstand</title>
<!--
  Entwicklungsvorschau ohne Home Assistant.

  Bildet `hass.callService(..., returnResponse)` nach und liefert dieselbe
  Nutzlast, die `ha_intervals.daten_abfragen` zurückgibt. Damit lässt sich das
  Panel bauen, ansehen und prüfen, ohne für jede Änderung ein Paket zu
  schnüren und HA neu zu starten.

      npm run build && open dev.html
      ?theme=dark   dunkles Theme
-->
<style>
  :root {
    --primary-text-color:#10161a; --secondary-text-color:#4a565e;
    --disabled-text-color:#7e8b93; --card-background-color:#fbfcfd;
    --primary-background-color:#eef1f3; --divider-color:rgba(16,22,26,0.10);
    --primary-color:#2a78d6; --ha-card-border-radius:10px;
  }
  :root[data-t="dark"] {
    --primary-text-color:#f2f6f8; --secondary-text-color:#aebac2;
    --disabled-text-color:#7e8b93; --card-background-color:#141b1f;
    --primary-background-color:#0a0f12; --divider-color:rgba(242,246,248,0.12);
    --primary-color:#3987e5;
  }
  html,body { margin:0; background:var(--primary-background-color); }
</style>
</head>
<body>
<ha-intervals-panel id="p"></ha-intervals-panel>

<script type="module">
import "../custom_components/ha_intervals/panel/ha-intervals-panel.js";

if (new URLSearchParams(location.search).get("theme") === "dark") {
  document.documentElement.dataset.t = "dark";
}

/* ── Nachgebildete Daten ───────────────────────────────────────────────── */

const HEUTE = new Date("2026-10-11T12:00:00");
const iso = (d) => d.toISOString().slice(0, 10);
const plus = (n) => { const d = new Date(HEUTE); d.setDate(d.getDate() + n); return d; };

// Last-Verlauf mit echter CTL/ATL-Rechnung, damit die Kurve plausibel liegt
const verlauf = [];
{
  let ctl = 31, atl = 31;
  const BY_DOW = [100, 0, 85, 45, 52, 0, 55];
  for (let i = 90; i >= 0; i--) {
    const d = plus(-i);
    const w = Math.floor((90 - i) / 7);
    const mult = [1, 1.07, 1.13, 0.8][w % 4] * (1 + 0.0042 * (90 - i));
    const krank = w === 7 && (d.getDay() === 2 || d.getDay() === 0);
    const load = krank ? 0 : Math.round(BY_DOW[d.getDay()] * mult);
    ctl += (load - ctl) / 42;
    atl += (load - atl) / 7;
    verlauf.push({
      day: iso(d),
      ctl: Math.round(ctl * 10) / 10,
      atl: Math.round(atl * 10) / 10,
      form: Math.round((ctl - atl) * 10) / 10,
    });
  }
}

const wochen = [];
for (let w = 12; w >= 0; w--) {
  const start = plus(-(w * 7 + ((HEUTE.getDay() + 6) % 7)));
  const km = Math.round((52 + (12 - w) * 1.8 + (w % 4 === 1 ? -22 : 0)) * 10) / 10;
  const min = Math.round(km * 5.8);
  wochen.push({
    start: iso(start), km, soll_km: Math.round(km * (0.95 + (w % 3) * 0.04)),
    last: Math.round(km * 7), sekunden: min * 60,
    zonen: [0.17, 0.6, 0.13, 0.07, 0.03].map((s) => Math.round(min * s)),
  });
}

const PLAN = [
  ["Ruhe", "Mobilität, 15 min", 0, "ruhe", 0],
  ["Intervall", "5 × 1000 m @ 4:28 · 400 m Trab", 92, "qualitaet", 11],
  ["Locker", "8 km, 5:45–6:00", 46, "locker", 8],
  ["Locker", "10 km + 6 × Steigerung", 58, "locker", 10],
  ["Ruhe", "", 0, "ruhe", 0],
  ["Locker", "10 km, Gelände", 55, "locker", 10],
  ["Longrun", "16 km, letzte 4 km @ 5:15", 104, "longrun", 16],
];

const PHASEN = ["Wiederaufbau","Wiederaufbau","Entwicklung","Schärfung"];
const plan = [];
for (let w = 0; w < 4; w++) {
  PLAN.forEach(([name, beschreibung, last, art, km], i) => {
    const tag = iso(plus(w * 7 + i + 1));
    plan.push({
      event_id: String(1000 + w * 7 + i), tag, art, name, last, km,
      beschreibung: beschreibung
        + "\n\n[HA-LAUFPLAN] art=" + art + " km=" + km
        + " woche=" + (w + 1) + " phase=" + PHASEN[w],
    });
  });
}

const trainings = verlauf
  .filter((v, i) => i % 2 === 0)
  .slice(-40).reverse()
  .map((v, i) => {
    const km = 8 + (i % 5) * 2.4;
    const pace = 318 + (i % 7) * 6;
    return {
      id: String(9000 + i), day: v.day, name: i % 5 === 0 ? "Longrun" : "Dauerlauf",
      kind: "Run", km: Math.round(km * 10) / 10, seconds: Math.round(km * pace),
      load: Math.round(km * 6.5), hr_avg: 140 + (i % 9), pace_s_km: pace,
    };
  });

const bestzeiten = [
  { distanz_km: 5, activity_id: "9003", tag: iso(plus(-20)), name: "Tempolauf",
    km: 5.1, sekunden: 1265, pace_s_km: 248, anzahl_laeufe: 7 },
  { distanz_km: 10, activity_id: "9011", tag: iso(plus(-41)), name: "Dauerlauf zügig",
    km: 10.2, sekunden: 2706, pace_s_km: 265, anzahl_laeufe: 19 },
  { distanz_km: 13, activity_id: "9019", tag: iso(plus(-62)), name: "Testlauf",
    km: 13.1, sekunden: 3629, pace_s_km: 277, anzahl_laeufe: 4 },
];

const DATEN = {
  stand: iso(HEUTE), renntag: "2027-01-10", tage_bis_rennen: 91,
  verlauf, wochen, plan, trainings, bestzeiten,
  analysen: [{
    activity_id: "9000", created: iso(HEUTE), model: "claude-opus-5",
    prose: "Der Longrun saß. 22,0 km bei 148 bpm mit 4,1 % Entkopplung zwischen "
      + "erster und zweiter Hälfte — unter 5 % gilt die Einheit als aerob gefahren.",
    verdict: { ausfuehrung: "gut", entkopplung_prozent: 4.1,
      empfehlung_naechste_woche: "Entlastungswoche nicht kürzen, 55 statt 75 km." },
  }],
};

/* ── hass-Attrappe ─────────────────────────────────────────────────────── */

const el = document.getElementById("p");
el.hass = {
  callService(domain, service, data, target, notify, returnResponse) {
    console.log("callService", domain + "." + service, data);
    if (service === "daten_abfragen") {
      const tage = data?.tage ?? 91;
      return Promise.resolve({ response: {
        ...DATEN,
        verlauf: DATEN.verlauf.slice(-tage),
        wochen: DATEN.wochen.slice(-Math.max(2, Math.round(tage / 7))),
      }});
    }
    if (service === "training_details") {
      // Splits eines 10ers mit negativem Split und steigendem Puls
      const paces = [336, 332, 329, 327, 325, 322, 320, 316, 311, 304];
      return Promise.resolve({ response: {
        ok: true,
        training: { id: data.activity_id, day: iso(plus(-41)), name: "Hatten",
          kind: "Run", km: 10.0, seconds: 3222, load: 61, hr_avg: 160, pace_s_km: 322 },
        splits: paces.map((p, i) => ({ km: i + 1, sekunden: p, pace_s_km: p,
          hf: 150 + i * 2, teil: false })).concat([
          { km: 0.24, sekunden: 71, pace_s_km: 296, hf: 171, teil: true }]),
        kennzahlen: { hf_mittel: 160, hf_max: 174, entkopplung_prozent: 3.8, punkte: 3222 },
        zonen_minuten: [4, 18, 21, 9, 2],
        geplant_war: { name: "Tempo 10 km", description: "10 km zügig, 5:20/km." },
        analyse: { created: iso(plus(-41)), model: "claude-opus-5",
          prose: "Sauber negativ gelaufen: die zweite Hälfte lag 11 s/km schneller "
               + "als die erste, bei nur 3,8 % Entkopplung. Genau so soll ein "
               + "Tempodauerlauf aussehen." },
        hinweis: null,
      }});
    }
    if (service === "verschieben") {
      // Einen abgelehnten Zug nachstellen, um Konflikt und Alternativen zu sehen
      if (data.event_id === "1001" && data.modus !== "streichen") {
        return Promise.resolve({ response: {
          ok: false,
          konflikte: [{ regel: "qualitaet_vor_longrun",
            text: "Harte Einheit am Sa direkt vor dem Longrun." }],
          alternativen: [
            { modus: "tauschen", ziel: iso(plus(3)), text: "Mit Do tauschen" },
            { modus: "streichen", ziel: iso(plus(2)), text: "Einheit streichen" },
          ],
          umplanung_noetig: false,
        }});
      }
      return Promise.resolve({ response: { ok: true, hinweise: [] } });
    }
    return Promise.resolve({ response: {} });
  },
};

/* Ansicht und Dialog per Query steuern, damit sich jede Seite einzeln
   aufnehmen und prüfen lässt: ?view=plan&move=1001&try=tauschen */
const q = new URLSearchParams(location.search);
setTimeout(() => {
  const r = el.shadowRoot;
  const v = q.get("view");
  if (v) r.querySelector(`[data-tab="${v}"]`)?.click();
  const det = q.get("detail");
  if (det) setTimeout(() => r.querySelector(`[data-detail="${det}"]`)?.click(), 200);
  const m = q.get("move");
  if (m) setTimeout(() => {
    r.querySelector(`[data-move="${m}"]`)?.click();
    const t = q.get("try");
    if (t) setTimeout(() => r.querySelector(`[data-do="${t}"]`)?.click(), 120);
  }, 120);
}, 400);
</script>
</body>
</html>
