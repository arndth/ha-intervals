# Diese Datei ist die Dokumentation der Schnittstelle nach außen.
# Jeder Service ist per REST aufrufbar:
#   POST /api/services/ha_intervals/<name>?return_response

sync:
  name: Jetzt abrufen
  description: Holt Aktivitäten, Wellness und Plan sofort von intervals.icu.
  fields:
    entry_id:
      description: Nur nötig, wenn mehrere Athleten eingerichtet sind.
      selector: { text: }

daten_abfragen:
  name: Alles abfragen
  description: >-
    Liefert in einem Aufruf alles, was das Dashboard zeigt: Lastverlauf,
    Wochenaggregate mit Zonenzeiten, Trainings, Plan, Bestzeiten, VO2max und
    die vorliegenden Analysen. Der Haupt-Lesezugriff — auch fürs Panel.
  fields:
    tage:
      default: 91
      description: Zeitraum in Tagen.
      selector: { number: { min: 7, max: 365, step: 1 } }
    entry_id:
      selector: { text: }

verschieben:
  name: Einheit verschieben
  description: >-
    Verschiebt, tauscht oder streicht eine geplante Einheit. Prüft fünf Regeln
    und liefert bei Ablehnung die zulässigen Alternativen zurück.
  fields:
    event_id:
      required: true
      description: intervals.icu-Event-ID der Einheit.
      selector: { text: }
    ziel:
      required: true
      description: "heute, morgen, uebermorgen oder JJJJ-MM-TT"
      example: morgen
      selector: { text: }
    modus:
      default: tauschen
      description: >-
        tauschen = mit dem Zieltag tauschen · schieben = Rest rückt nach ·
        streichen = Einheit entfällt (wird nie abgelehnt)
      selector:
        select:
          options: [tauschen, schieben, streichen]
    entry_id:
      selector: { text: }

umplanen:
  name: Woche neu planen
  description: >-
    Lässt die Restwoche von Claude neu planen. Nur nötig, wenn kein zulässiger
    Einzelzug mehr existiert — das normale Verschieben braucht keine KI.
  fields:
    ab_datum:
      description: Ab wann neu geplant wird (Vorgabe heute).
      selector: { text: }
    grund:
      description: Anlass, geht in den Prompt ein.
      example: Zwei Einheiten wegen Erkältung ausgefallen
      selector: { text: }
    entry_id:
      selector: { text: }

analysieren:
  name: Lauf analysieren
  description: Bewertet eine Aktivität. Ohne Angabe die jüngste.
  fields:
    activity_id:
      selector: { text: }
    entry_id:
      selector: { text: }

plan_abfragen:
  name: Plan abfragen
  description: >-
    Liefert alle geplanten Einheiten strukturiert zurück. Der Lesezugriff für
    einen externen Agenten.
  fields:
    entry_id:
      selector: { text: }

plan_erstellen:
  name: Trainingsplan erstellen
  description: >-
    Rechnet einen periodisierten 13-Wochen-Plan auf den Renntag und schreibt
    ihn nach intervals.icu. Wiederholbar — eigene Einträge werden ersetzt,
    von Hand angelegte Einheiten bleiben unberührt.
  fields:
    trocken:
      default: true
      description: >-
        Nur rechnen und anzeigen, nichts schreiben. Vorgabe ist an; erst mit
        "false" landet der Plan im Kalender.
      selector: { boolean: }
    ziel_pace:
      description: Angestrebtes Renntempo als MM:SS pro Kilometer.
      example: "4:30"
      selector: { text: }
    locker_pace:
      description: >-
        Dein gewohntes Dauerlauftempo als MM:SS. Ohne Angabe der Median aller
        Läufe über 7 km aus den letzten 120 Tagen. Steuert die lockeren
        Einheiten; die harten richten sich nach dem Ziel.
      example: "5:30"
      selector: { text: }
    basis_km:
      description: >-
        Typische Laufdistanz. Ohne Angabe der Median deiner Läufe. Streckt die
        Wochenvorlage auf deinen Umfang — der lange Lauf wird bei 1,5 ×
        Renndistanz gedeckelt.
      example: 10
      selector: { number: { min: 3, max: 30, step: 0.5 } }
    start_pace:
      description: >-
        Heutiges Wettkampftempo als MM:SS. Ohne Angabe wird es aus dem besten
        Lauf der letzten 120 Tage geschätzt. Die Tempovorgaben wandern von
        hier zum Ziel, damit die ersten Wochen laufbar sind.
      example: "5:12"
      selector: { text: }
    entry_id:
      selector: { text: }

training_details:
  name: Training im Detail
  description: >-
    Eckdaten, Kilometer-Splits, Zonenzeiten, die geplante Einheit des Tages
    und die Analyse zu einem einzelnen Lauf. Die Splits werden bei jedem
    Aufruf frisch aus den Streams gerechnet.
  fields:
    activity_id:
      required: true
      description: ID der Aktivität in intervals.icu.
      selector: { text: }
    entry_id:
      selector: { text: }

plan_exportieren:
  name: Plan an Webhook schicken
  description: >-
    Schickt geplante Einheiten als flaches JSON an die in den Optionen
    hinterlegte Webhook-Adresse — je Einheit ein Aufruf mit athleteid, title,
    description (Workout-Schreibweise) und workoutday. Passt damit auf den
    n8n-Sub-Workflow „Send to TrainingPeaks".
  fields:
    von:
      description: Ab wann (heute, morgen oder JJJJ-MM-TT). Vorgabe heute.
      selector: { text: }
    bis:
      description: Bis wann. Vorgabe in 14 Tagen.
      selector: { text: }
    trocken:
      default: true
      description: Nur anzeigen, was gesendet würde.
      selector: { boolean: }
    entry_id:
      selector: { text: }
